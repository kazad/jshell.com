<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Split — share expenses | JShell</title>
<meta name="description" content="Split bills with friends. Pick any URL, add expenses in any currency, settle up over Venmo or PayPal. 100% client-side.">
<script src="../assets/lz-string.js"></script>
<style>
:root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --surface-2: #f0f2f3;
    --border: #e4e7e9;
    --text: #17211f;
    --muted: #6b7a76;
    --accent: #059669;
    --accent-soft: #d9f2e7;
    --red: #dc2626;
    --red-soft: #fde8e8;
    --shadow: 0 1px 2px rgba(20, 30, 27, .05), 0 8px 24px -12px rgba(20, 30, 27, .12);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0e1211;
        --surface: #171c1b;
        --surface-2: #1f2624;
        --border: #29322f;
        --text: #e8ecea;
        --muted: #8fa09a;
        --accent: #34d399;
        --accent-soft: #123528;
        --red: #f87171;
        --red-soft: #3a1a1a;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
    }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
    padding: 0 16px calc(48px + env(safe-area-inset-bottom));
}
.wrap { max-width: 560px; margin: 0 auto; }
a { color: var(--accent); text-decoration: none; }

/* top bar */
.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 2px 6px;
    font-size: 13px; color: var(--muted);
}
.topbar .brand { font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.topbar .brand b { color: var(--text); }

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 18px;
    margin-top: 14px;
}
.card h2 {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 12px;
}

/* hero / title */
.hero { padding: 22px 2px 2px; }
.hero h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.hero p { color: var(--muted); margin-top: 6px; }
input.title-input {
    width: 100%; border: none; background: transparent; color: var(--text);
    font-size: 26px; font-weight: 800; letter-spacing: -.02em; padding: 0;
}
input.title-input:focus { outline: none; }
.urlchip {
    display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    margin-top: 8px; padding: 5px 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap; overflow: hidden;
}
.urlchip span { overflow: hidden; text-overflow: ellipsis; }
.urlchip:active { background: var(--surface-2); }

/* generic controls */
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text);
    padding: 9px 16px; font-size: 14px; font-weight: 600;
    transition: transform .06s ease, background .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #08130e; } }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; padding: 13px; font-size: 16px; border-radius: 14px; }
input[type=text], input[type=search], select {
    font: inherit; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
label.small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface-2); color: var(--text);
    padding: 7px 13px 7px 7px; font-size: 14px; font-weight: 600;
}
.chip .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
}
.chip.selectable { cursor: pointer; padding: 7px 13px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip.add { cursor: pointer; padding: 7px 13px; color: var(--muted); border-style: dashed; background: transparent; }

/* expense list */
.rows { display: flex; flex-direction: column; }
.row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px; border-top: 1px solid var(--border);
}
.rows .row:first-child { border-top: none; }
.row .grow { flex: 1; min-width: 0; }
.row .desc { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12.5px; color: var(--muted); }
.row .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .amt small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.row .del {
    border: none; background: transparent; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 8px 2px 8px 6px;
}
.row .del:hover { color: var(--red); }

/* balances */
.bal { display: flex; align-items: center; gap: 10px; padding: 9px 2px; }
.bal .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bal .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.bal .num.pos { color: var(--accent); }
.bal .num.neg { color: var(--red); }
.bal .bar { flex: 1.4; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.bal .bar i { display: block; height: 100%; border-radius: 3px; }

/* settle */
.txn {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
    padding: 13px 2px; border-top: 1px solid var(--border);
}
.txn:first-child { border-top: none; }
.txn .who { flex: 1 1 auto; min-width: 0; font-size: 15px; }
.txn .who b { font-weight: 700; }
.txn .arrow { color: var(--muted); padding: 0 2px; }
.txn .amount { font-weight: 800; font-variant-numeric: tabular-nums; }
.txn .pay { display: flex; gap: 6px; }
.paybtn {
    border: none; border-radius: 999px; padding: 6px 13px;
    font-size: 12.5px; font-weight: 700; color: #fff; text-decoration: none;
    display: inline-flex; align-items: center;
}
.paybtn.venmo { background: #008cff; }
.paybtn.paypal { background: #003087; }
@media (prefers-color-scheme: dark) { .paybtn.paypal { background: #0070e0; } }

/* add expense form */
.amount-row { display: flex; gap: 8px; }
.amount-row input { flex: 1; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.amount-row select { width: auto; font-weight: 600; }

/* person editor */
.editor { background: var(--surface-2); border-radius: 14px; padding: 14px; margin-top: 10px; }
.editor .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.editor .grid .full { grid-column: 1 / -1; }
.editor input { background: var(--surface); }
.editor .actions { display: flex; justify-content: space-between; margin-top: 10px; }
.linklike { border: none; background: none; padding: 6px 2px; font-size: 13.5px; font-weight: 600; color: var(--accent); }
.linklike.danger { color: var(--red); }

.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 26px; line-height: 1.7; }
.footer .dot { opacity: .5; padding: 0 6px; }

/* landing */
.landing-hero { text-align: center; padding: 46px 8px 10px; }
.landing-hero .mark {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 18px;
    background: var(--accent); color: #fff; font-size: 28px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
}
.landing-hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.landing-hero p { color: var(--muted); margin-top: 8px; font-size: 16.5px; }
.newform { display: flex; gap: 8px; margin-top: 4px; }
.newform .idwrap {
    flex: 1; display: flex; align-items: center; min-width: 0;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 0 0 0 14px;
}
.newform .idwrap:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
.newform .prefix { color: var(--muted); font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.newform input { border: none; background: transparent; padding: 12px 8px 12px 2px; min-width: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
.newform input:focus { outline: none; }
.recent a.row { color: var(--text); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; text-align: center; }

.toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg);
    padding: 9px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ---------------- constants ---------------- */

const CURRENCIES = ['USD','EUR','GBP','JPY','CAD','AUD','CHF','CNY','INR','MXN','BRL','KRW','SEK','NOK','DKK','PLN','NZD','SGD','HKD','THB'];
const ZERO_DEC = new Set(['JPY','KRW']);

// Offline fallback (approximate, EUR-based) — replaced by live ECB rates when online.
const FALLBACK_RATES = {
    EUR:1, USD:1.08, GBP:0.85, JPY:168, CAD:1.48, AUD:1.65, CHF:0.95, CNY:7.8,
    INR:92, MXN:19.5, BRL:6.0, KRW:1500, SEK:11.4, NOK:11.6, DKK:7.46, PLN:4.3,
    NZD:1.79, SGD:1.44, HKD:8.4, THB:38
};

const AVATAR_COLORS = ['#059669','#2563eb','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d'];

const ID_WORDS_A = ['sunny','cosmic','lucky','golden','breezy','mellow','swift','tidy','maple','coral'];
const ID_WORDS_B = ['trip','dinner','weekend','cabin','picnic','roadtrip','brunch','getaway','tab','crew'];

/* ---------------- state ---------------- */

let rates = null;        // { base:'EUR', date:'...', rates:{USD:1.08,...}, live:bool }
let state = null;        // current split data
let ui = { editingPerson: null, splitAmong: null, paidBy: null };

function blankSplit(id) {
    return { v: 1, id, title: prettify(id), currency: 'USD', people: [], expenses: [], updated: Date.now() };
}
function prettify(id) {
    return id.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function sanitizeId(raw) {
    return (raw || '').toLowerCase().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-_]/g, '').slice(0, 48);
}
function storageKey(id) { return 'split:' + id; }

function loadSplit(id) {
    try {
        const raw = localStorage.getItem(storageKey(id));
        if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
}
function save() {
    if (!state) return;
    state.updated = Date.now();
    try { localStorage.setItem(storageKey(state.id), JSON.stringify(state)); } catch (e) {}
}

/* ---------------- URL routing: #id or #id!<compressed data> ---------------- */

function parseHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return { id: null, data: null };
    const bang = h.indexOf('!');
    if (bang === -1) return { id: sanitizeId(h), data: null };
    let data = null;
    try {
        const enc = h.slice(bang + 1);
        if (enc[0] === 'z') data = JSON.parse(LZString.decompressFromEncodedURIComponent(enc.slice(1)));
    } catch (e) {}
    return { id: sanitizeId(h.slice(0, bang)), data };
}

// Path-style URLs (/split/tahoe-trip) — served via a rewrite rule to this page.
function idFromPath() {
    const m = location.pathname.match(/\/split\/([^\/]+?)\/?$/);
    if (m && m[1] !== 'index.html') return sanitizeId(decodeURIComponent(m[1]));
    return null;
}
function basePath() {
    return idFromPath() ? location.pathname.replace(/[^\/]+\/?$/, '') : location.pathname;
}

function route() {
    const parsed = parseHash();
    const id = parsed.id || idFromPath();
    const data = parsed.data;
    if (!id) { state = null; renderLanding(); return; }

    const local = loadSplit(id);
    if (data && data.id === id) {
        // Imported share link: newer copy wins.
        state = (!local || (data.updated || 0) >= (local.updated || 0)) ? data : local;
        save();
        history.replaceState(null, '', idFromPath() === id ? location.pathname : '#' + id);
    } else {
        state = local || blankSplit(id);
        save();
    }
    ui = { editingPerson: null, splitAmong: null, paidBy: null };
    renderApp();
}

function shareLink() {
    const enc = 'z' + LZString.compressToEncodedURIComponent(JSON.stringify(state));
    return location.origin + basePath() + '#' + state.id + '!' + enc;
}

function canonicalUrl(id) {
    if (idFromPath() === id) return location.origin + location.pathname;
    return location.origin + basePath().replace(/index\.html$/, '') + '#' + id;
}

/* ---------------- currency ---------------- */

async function loadRates() {
    try {
        const cached = JSON.parse(localStorage.getItem('split:rates') || 'null');
        if (cached && Date.now() - cached.fetched < 12 * 3600 * 1000) { rates = cached; return; }
    } catch (e) {}
    try {
        const r = await fetch('https://api.frankfurter.dev/v1/latest?base=EUR', { signal: AbortSignal.timeout(6000) });
        const j = await r.json();
        rates = { date: j.date, rates: Object.assign({ EUR: 1 }, j.rates), live: true, fetched: Date.now() };
        localStorage.setItem('split:rates', JSON.stringify(rates));
    } catch (e) {
        rates = { date: null, rates: FALLBACK_RATES, live: false, fetched: 0 };
    }
    if (state) renderApp();
}

// amount (major units) in `from` → cents in `to`
function convertCents(amount, from, to) {
    if (from === to) return Math.round(amount * 100);
    const r = (rates && rates.rates) || FALLBACK_RATES;
    const rf = r[from] || FALLBACK_RATES[from] || 1;
    const rt = r[to] || FALLBACK_RATES[to] || 1;
    return Math.round((amount / rf) * rt * 100);
}

function fmt(cents, cur) {
    const digits = ZERO_DEC.has(cur) ? 0 : 2;
    try {
        return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, minimumFractionDigits: digits, maximumFractionDigits: digits }).format(cents / 100);
    } catch (e) {
        return cur + ' ' + (cents / 100).toFixed(digits);
    }
}
function fmtPlain(cents, cur) {
    return (cents / 100).toFixed(ZERO_DEC.has(cur) ? 0 : 2);
}

/* ---------------- math ---------------- */

function balances() {
    // net cents in base currency per person id  (+ is owed money, − owes)
    const net = {};
    state.people.forEach(p => net[p.id] = 0);
    for (const e of state.expenses) {
        const among = e.among.filter(pid => net[pid] !== undefined);
        if (!among.length) continue;
        const cents = convertCents(e.amount, e.currency, state.currency);
        if (net[e.paidBy] !== undefined) net[e.paidBy] += cents;
        const each = Math.floor(cents / among.length);
        let rem = cents - each * among.length;
        for (const pid of among) net[pid] -= each + (rem-- > 0 ? 1 : 0);
    }
    return net;
}

function settleUp(net) {
    const debtors = [], creditors = [];
    for (const [id, c] of Object.entries(net)) {
        if (c < -0) debtors.push({ id, c: -c });
        else if (c > 0) creditors.push({ id, c });
    }
    debtors.sort((a, b) => b.c - a.c);
    creditors.sort((a, b) => b.c - a.c);
    const txns = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
        const amt = Math.min(debtors[i].c, creditors[j].c);
        if (amt > 0) txns.push({ from: debtors[i].id, to: creditors[j].id, cents: amt });
        debtors[i].c -= amt; creditors[j].c -= amt;
        if (debtors[i].c <= 0) i++;
        if (creditors[j].c <= 0) j++;
    }
    return txns;
}

/* ---------------- helpers ---------------- */

const $ = sel => document.querySelector(sel);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function person(id) { return state.people.find(p => p.id === id); }
function personName(id) { return (person(id) || { name: '?' }).name; }
function avatarColor(p) { return AVATAR_COLORS[state.people.indexOf(p) % AVATAR_COLORS.length]; }
function initials(name) { return name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
function uid() { return Math.random().toString(36).slice(2, 9); }

let toastTimer;
function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function copy(text, msg) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => toast(msg)).catch(() => prompt('Copy this link:', text));
}

function displayUrl(id) {
    return canonicalUrl(id).replace(/^https?:\/\//, '');
}

function currencyOptions(sel) {
    return CURRENCIES.map(c => `<option value="${c}" ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
}

/* ---------------- payment links ---------------- */

function venmoLink(handle, cents, note) {
    return 'https://venmo.com/' + encodeURIComponent(handle.replace(/^@/, '')) +
        '?txn=pay&amount=' + fmtPlain(cents, state.currency) + '&note=' + encodeURIComponent(note);
}
function paypalLink(handle, cents) {
    return 'https://paypal.me/' + encodeURIComponent(handle.replace(/^@/, '')) +
        '/' + fmtPlain(cents, state.currency) + state.currency;
}

/* ---------------- landing view ---------------- */

function renderLanding() {
    document.title = 'Split — share expenses | JShell';
    let recent = [];
    try {
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('split:') && k !== 'split:rates') {
                const s = JSON.parse(localStorage.getItem(k));
                if (s && s.id) recent.push(s);
            }
        }
    } catch (e) {}
    recent.sort((a, b) => (b.updated || 0) - (a.updated || 0));

    const suggestion = ID_WORDS_A[Math.floor(Math.random() * ID_WORDS_A.length)] + '-' +
                       ID_WORDS_B[Math.floor(Math.random() * ID_WORDS_B.length)];

    $('#app').innerHTML = `
        <div class="topbar"><a href="../index.html" style="color:var(--muted)">← jshell.com</a><span class="brand"><b>split</b></span></div>
        <div class="landing-hero">
            <div class="mark">÷</div>
            <h1>Split the bill.</h1>
            <p>Pick any URL. Add expenses in any currency.<br>Settle up over Venmo or PayPal.</p>
        </div>
        <div class="card">
            <h2>Start a split</h2>
            <form class="newform" id="newForm">
                <div class="idwrap">
                    <span class="prefix">/split/#</span>
                    <input type="text" id="newId" placeholder="${esc(suggestion)}" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
                </div>
                <button class="btn primary" type="submit">Go</button>
            </form>
            <p class="hint">Everything lives in your browser and in the links you share — no accounts, no server.</p>
        </div>
        ${recent.length ? `
        <div class="card recent">
            <h2>Your splits</h2>
            <div class="rows">
                ${recent.map(s => `
                    <a class="row" href="#${esc(s.id)}">
                        <div class="grow">
                            <div class="desc">${esc(s.title || s.id)}</div>
                            <div class="meta">/${esc(s.id)} · ${s.people.length} ${s.people.length === 1 ? 'person' : 'people'} · ${s.expenses.length} expense${s.expenses.length === 1 ? '' : 's'}</div>
                        </div>
                        <div class="amt">${fmt(s.expenses.reduce((t, e) => t + convertCents(e.amount, e.currency, s.currency), 0), s.currency)}</div>
                    </a>`).join('')}
            </div>
        </div>` : ''}
        <div class="footer">100% client-side · <a href="../index.html">jshell.com</a></div>
    `;

    $('#newForm').addEventListener('submit', ev => {
        ev.preventDefault();
        const id = sanitizeId($('#newId').value) || sanitizeId(suggestion);
        location.hash = id;
    });
}

/* ---------------- app view ---------------- */

function renderApp() {
    document.title = (state.title || state.id) + ' — Split | JShell';
    const net = balances();
    const txns = settleUp(net);
    const totalCents = state.expenses.reduce((t, e) => t + convertCents(e.amount, e.currency, state.currency), 0);
    const maxAbs = Math.max(1, ...Object.values(net).map(Math.abs));
    const hasPeople = state.people.length > 0;
    const paidBy = ui.paidBy && person(ui.paidBy) ? ui.paidBy : (state.people[0] || {}).id;
    const among = ui.splitAmong || state.people.map(p => p.id);

    $('#app').innerHTML = `
        <div class="topbar">
            <a href="${idFromPath() ? './' : '#'}" style="color:var(--muted)">← all splits</a>
            <span class="brand"><b>split</b></span>
        </div>

        <div class="hero">
            <input class="title-input" id="titleInput" value="${esc(state.title)}" placeholder="Name this split" enterkeyhint="done">
            <button class="urlchip" id="copyUrl" title="Copy URL"><span>${esc(displayUrl(state.id))}</span> ⧉</button>
        </div>

        <div class="card">
            <h2>People</h2>
            <div class="chips" id="peopleChips">
                ${state.people.map(p => `
                    <button class="chip" data-edit="${p.id}" title="Edit ${esc(p.name)}">
                        <span class="avatar" style="background:${avatarColor(p)}">${esc(initials(p.name))}</span>${esc(p.name)}
                    </button>`).join('')}
                <button class="chip add" id="addPersonBtn">+ Add person</button>
            </div>
            <div id="personEditor"></div>
        </div>

        <div class="card">
            <h2>Add expense</h2>
            ${hasPeople ? `
            <form id="expForm">
                <div class="amount-row">
                    <input type="text" inputmode="decimal" id="expAmount" placeholder="0.00" autocomplete="off">
                    <select id="expCurrency">${currencyOptions(ui.expCurrency || state.currency)}</select>
                </div>
                <label class="small">For</label>
                <input type="text" id="expDesc" placeholder="Dinner, taxi, groceries…" autocomplete="off">
                <label class="small">Paid by</label>
                <div class="chips" id="paidByChips">
                    ${state.people.map(p => `<button type="button" class="chip selectable ${p.id === paidBy ? 'on' : ''}" data-paidby="${p.id}">${esc(p.name)}</button>`).join('')}
                </div>
                <label class="small">Split between</label>
                <div class="chips" id="amongChips">
                    ${state.people.map(p => `<button type="button" class="chip selectable ${among.includes(p.id) ? 'on' : ''}" data-among="${p.id}">${esc(p.name)}</button>`).join('')}
                </div>
                <div style="margin-top:14px"><button class="btn primary block" type="submit">Add expense</button></div>
            </form>` : `<p class="empty">Add a couple of people first — then log who paid for what.</p>`}
        </div>

        ${state.expenses.length ? `
        <div class="card">
            <h2>Expenses · ${fmt(totalCents, state.currency)} total</h2>
            <div class="rows">
                ${state.expenses.slice().reverse().map(e => {
                    const conv = convertCents(e.amount, e.currency, state.currency);
                    const foreign = e.currency !== state.currency;
                    return `
                    <div class="row">
                        <div class="grow">
                            <div class="desc">${esc(e.desc || 'Expense')}</div>
                            <div class="meta">${esc(personName(e.paidBy))} paid · split ${e.among.length} way${e.among.length === 1 ? '' : 's'}</div>
                        </div>
                        <div class="amt">${fmt(Math.round(e.amount * 100), e.currency)}${foreign ? `<small>≈ ${fmt(conv, state.currency)}</small>` : ''}</div>
                        <button class="del" data-delexp="${e.id}" title="Delete">✕</button>
                    </div>`;
                }).join('')}
            </div>
        </div>` : ''}

        ${hasPeople && state.expenses.length ? `
        <div class="card">
            <h2>Balances</h2>
            ${state.people.map(p => {
                const c = net[p.id] || 0;
                const w = Math.round(Math.abs(c) / maxAbs * 100);
                return `
                <div class="bal">
                    <div class="name">${esc(p.name)}</div>
                    <div class="bar">${c >= 0
                        ? `<i style="margin-left:50%;width:${w / 2}%;background:var(--accent)"></i>`
                        : `<i style="margin-left:${50 - w / 2}%;width:${w / 2}%;background:var(--red)"></i>`}</div>
                    <div class="num ${c > 0 ? 'pos' : c < 0 ? 'neg' : ''}">${c > 0 ? '+' : ''}${fmt(c, state.currency)}</div>
                </div>`;
            }).join('')}
        </div>

        <div class="card">
            <h2>Settle up</h2>
            ${txns.length ? txns.map(t => {
                const to = person(t.to) || {};
                const note = (state.title || state.id) + ' — settling up';
                return `
                <div class="txn">
                    <div class="who"><b>${esc(personName(t.from))}</b><span class="arrow"> → </span><b>${esc(personName(t.to))}</b>&nbsp; <span class="amount">${fmt(t.cents, state.currency)}</span></div>
                    <div class="pay">
                        ${to.venmo ? `<a class="paybtn venmo" target="_blank" rel="noopener" href="${venmoLink(to.venmo, t.cents, note)}">Venmo</a>` : ''}
                        ${to.paypal ? `<a class="paybtn paypal" target="_blank" rel="noopener" href="${paypalLink(to.paypal, t.cents)}">PayPal</a>` : ''}
                        ${!to.venmo && !to.paypal ? `<button class="linklike" data-edit2="${t.to}">+ add handle</button>` : ''}
                    </div>
                </div>`;
            }).join('') : '<p class="empty">All settled — nobody owes anything. 🎉</p>'}
        </div>` : ''}

        <div class="card">
            <h2>Share</h2>
            <button class="btn primary block" id="shareBtn">Copy share link</button>
            <p class="hint">The link carries the whole split — anyone who opens it gets the latest copy.</p>
        </div>

        <div class="footer">
            Base currency
            <select id="baseCurrency" style="width:auto;display:inline-block;padding:4px 8px;font-size:12px;margin-left:4px">${currencyOptions(state.currency)}</select>
            <br>${rates && rates.live ? 'FX: European Central Bank, ' + esc(rates.date) : 'FX: offline estimates'}<span class="dot">·</span>100% client-side<span class="dot">·</span><a href="../index.html">jshell.com</a>
        </div>
    `;

    bindApp(paidBy, among);
    if (ui.editingPerson !== null) renderPersonEditor();
}

function bindApp(paidBy, among) {
    $('#titleInput').addEventListener('change', ev => { state.title = ev.target.value.trim() || prettify(state.id); save(); renderApp(); });
    $('#copyUrl').addEventListener('click', () => copy(canonicalUrl(state.id), 'URL copied'));
    $('#shareBtn').addEventListener('click', () => copy(shareLink(), 'Share link copied'));
    $('#baseCurrency').addEventListener('change', ev => { state.currency = ev.target.value; save(); renderApp(); });

    $('#addPersonBtn').addEventListener('click', () => { ui.editingPerson = 'new'; renderApp(); });
    document.querySelectorAll('[data-edit]').forEach(el =>
        el.addEventListener('click', () => { ui.editingPerson = el.dataset.edit; renderApp(); }));
    document.querySelectorAll('[data-edit2]').forEach(el =>
        el.addEventListener('click', () => { ui.editingPerson = el.dataset.edit2; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));

    document.querySelectorAll('[data-delexp]').forEach(el =>
        el.addEventListener('click', () => {
            state.expenses = state.expenses.filter(e => e.id !== el.dataset.delexp);
            save(); renderApp();
        }));

    const form = $('#expForm');
    if (!form) return;

    document.querySelectorAll('[data-paidby]').forEach(el =>
        el.addEventListener('click', () => { ui.paidBy = el.dataset.paidby; keepFormValues(); renderApp(); }));
    document.querySelectorAll('[data-among]').forEach(el =>
        el.addEventListener('click', () => {
            const id = el.dataset.among;
            let sel = ui.splitAmong || state.people.map(p => p.id);
            sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id);
            ui.splitAmong = sel;
            keepFormValues(); renderApp();
        }));
    $('#expCurrency').addEventListener('change', ev => { ui.expCurrency = ev.target.value; });

    form.addEventListener('submit', ev => {
        ev.preventDefault();
        const amount = parseFloat(String($('#expAmount').value).replace(/,/g, '.').replace(/[^0-9.]/g, ''));
        const selAmong = (ui.splitAmong || state.people.map(p => p.id)).filter(id => person(id));
        if (!(amount > 0)) { toast('Enter an amount'); $('#expAmount').focus(); return; }
        if (!selAmong.length) { toast('Pick who splits it'); return; }
        state.expenses.push({
            id: uid(),
            desc: $('#expDesc').value.trim(),
            amount: Math.round(amount * 100) / 100,
            currency: $('#expCurrency').value,
            paidBy: paidBy,
            among: selAmong,
            ts: Date.now()
        });
        ui.splitAmong = null; ui.expAmount = ''; ui.expDesc = '';
        save(); renderApp();
        toast('Expense added');
    });

    // restore in-progress form values across re-renders
    if (ui.expAmount) $('#expAmount').value = ui.expAmount;
    if (ui.expDesc) $('#expDesc').value = ui.expDesc;
}

function keepFormValues() {
    ui.expAmount = ($('#expAmount') || {}).value || '';
    ui.expDesc = ($('#expDesc') || {}).value || '';
}

function renderPersonEditor() {
    const isNew = ui.editingPerson === 'new';
    const p = isNew ? { name: '', venmo: '', paypal: '' } : person(ui.editingPerson);
    if (!p) { ui.editingPerson = null; return; }

    $('#personEditor').innerHTML = `
        <div class="editor">
            <div class="grid">
                <input class="full" type="text" id="pName" placeholder="Name" value="${esc(p.name)}" autocomplete="off" ${isNew ? 'autofocus' : ''}>
                <input type="text" id="pVenmo" placeholder="Venmo @handle" value="${esc(p.venmo || '')}" autocapitalize="none" autocomplete="off">
                <input type="text" id="pPaypal" placeholder="PayPal.Me handle" value="${esc(p.paypal || '')}" autocapitalize="none" autocomplete="off">
            </div>
            <div class="actions">
                ${isNew ? '<span></span>' : `<button class="linklike danger" id="pDelete">Remove</button>`}
                <div>
                    <button class="linklike" id="pCancel" style="color:var(--muted)">Cancel</button>
                    <button class="btn primary small" id="pSave">${isNew ? 'Add' : 'Save'}</button>
                </div>
            </div>
        </div>
    `;

    const commit = () => {
        const name = $('#pName').value.trim();
        if (!name) { toast('Name is required'); $('#pName').focus(); return; }
        if (isNew) {
            state.people.push({ id: uid(), name, venmo: $('#pVenmo').value.trim(), paypal: $('#pPaypal').value.trim() });
        } else {
            p.name = name; p.venmo = $('#pVenmo').value.trim(); p.paypal = $('#pPaypal').value.trim();
        }
        ui.editingPerson = null; ui.splitAmong = null;
        save(); renderApp();
    };
    $('#pSave').addEventListener('click', commit);
    $('#personEditor').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); } });
    $('#pCancel').addEventListener('click', () => { ui.editingPerson = null; renderApp(); });
    if (!isNew) $('#pDelete').addEventListener('click', () => {
        state.people = state.people.filter(x => x.id !== p.id);
        state.expenses = state.expenses
            .map(e => ({ ...e, among: e.among.filter(id => id !== p.id) }))
            .filter(e => e.among.length && person(e.paidBy));
        ui.editingPerson = null; ui.splitAmong = null;
        save(); renderApp();
    });
    if (isNew) $('#pName').focus();
}

/* ---------------- boot ---------------- */

window.addEventListener('hashchange', route);
route();
loadRates();
</script>
</body>
</html>
