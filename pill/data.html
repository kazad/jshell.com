<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ValEye — Data Manager</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#faf7f2; --surface:#fff; --surface-2:#f1ece3; --text:#2d3142; --dim:#8a8f9e;
      --pass:#2fb380; --warn:#e9a13b; --fail:#e2606f; --shadow:0 2px 14px rgba(45,49,66,.08); }
    * { box-sizing:border-box; margin:0; }
    [hidden] { display:none !important; }
    body { background:var(--bg); color:var(--text); padding:24px 20px 60px;
      font-family: ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; max-width:980px; margin:0 auto; }
    h1 { font-size:20px; margin-bottom:2px; }
    h2 { font-size:16px; margin:26px 0 10px; }
    .links a { color:#1f8f65; text-decoration:none; margin-right:14px; font-size:14px; }
    #status { color:var(--dim); font-size:13px; margin-top:6px; }
    .tiles { display:flex; gap:14px; flex-wrap:wrap; margin:16px 0; }
    .tile { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:12px 18px; text-align:center; }
    .tile b { display:block; font-size:24px; }
    .tile span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }

    .card { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-bottom:14px; }
    .row { display:flex; gap:14px; align-items:flex-start; }
    .thumb { width:110px; height:110px; object-fit:cover; border-radius:10px; background:var(--surface-2);
      cursor:zoom-in; flex-shrink:0; }
    .meta { flex:1; min-width:0; font-size:13px; }
    .meta .when { color:var(--dim); font-size:12px; }
    .counts { display:flex; gap:16px; margin:6px 0; flex-wrap:wrap; }
    .counts div b { font-size:20px; display:block; }
    .counts div span { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
    .ok { color:var(--pass); } .bad { color:var(--fail); } .flag { color:var(--warn); font-size:12px; }
    .tags { font-size:11px; color:var(--dim); margin-top:4px; word-break:break-all; }
    .edit { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
    .edit input { border:1px solid var(--surface-2); border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; background:var(--bg); }
    .edit input.num { width:70px; } .edit input.med { width:130px; } .edit input.note { flex:1; min-width:160px; }
    button { border:0; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer;
      background:var(--surface-2); color:var(--text); }
    button.save { background:#dff2ea; color:#1f8f65; font-weight:600; }
    button.del { background:#fbe7ea; color:var(--fail); }
    button.more { display:block; margin:10px auto; padding:10px 26px; }
    button:disabled { opacity:.5; cursor:default; }

    details.session { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); margin-bottom:14px; }
    details.session > summary { cursor:pointer; padding:12px 14px; font-size:14px; font-weight:600; list-style:none; }
    details.session > summary::before { content:'▸ '; color:var(--dim); }
    details.session[open] > summary::before { content:'▾ '; }
    details.session .sess-body { padding:0 14px 14px; }
    .frames { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; }
    .frame { flex-shrink:0; width:150px; text-align:center; font-size:11px; color:var(--dim); }
    .frame img { width:150px; height:150px; object-fit:cover; border-radius:10px; background:var(--surface-2); cursor:zoom-in; }
    .frame b { color:var(--text); font-size:14px; }
    .sess-actions { margin-top:8px; }

    #lightbox { position:fixed; inset:0; background:rgba(45,49,66,.85); display:none;
      align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
    #lightbox img { max-width:94vw; max-height:94vh; border-radius:12px; }

    #keybar { margin-top:10px; font-size:13px; }
    #keybar input { border:1px solid var(--surface-2); border-radius:8px; padding:7px 10px; font:inherit; width:280px; }
  </style>
</head>
<body>
  <h1>ValEye — Data Manager</h1>
  <div class="links"><a href="./">← app</a> <a href="stats.html">stats</a> <a href="test.html">test bench</a> <a href="about.html">how it works</a></div>
  <div id="keybar" hidden>
    <input id="keyinput" type="password" placeholder="admin key" />
    <button id="keygo" class="save">unlock</button>
  </div>
  <p id="status">…</p>

  <h2>Test suite</h2>
  <div class="tiles" id="suite"><div class="tile"><b>…</b><span>suite images</span></div></div>

  <h2>Submissions</h2>
  <div id="list"></div>
  <button class="more" id="more" hidden>load more</button>

  <div id="lightbox"><img alt="" /></div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const KEY_LS = 'valeye_admin_key';
    const fmt = (ts) => new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const SESSION_RE = /^session (\w+)/;

    let key = localStorage.getItem(KEY_LS) || '';
    let oldestTs = null;
    const rowsById = new Map();

    // ---- API ----
    async function admin(body) {
      const r = await fetch('api/admin', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-valeye-key': key },
        body: JSON.stringify(body),
      });
      if (r.status === 401) { badKey(); throw new Error('unauthorized'); }
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || r.status);
      return j;
    }

    function badKey() {
      localStorage.removeItem(KEY_LS); key = '';
      $('#keybar').hidden = false;
      $('#status').textContent = 'enter the admin key to manage data';
    }
    $('#keygo').onclick = () => {
      key = $('#keyinput').value.trim();
      if (!key) return;
      localStorage.setItem(KEY_LS, key);
      $('#keybar').hidden = true;
      $('#list').innerHTML = ''; oldestTs = null; rowsById.clear();
      loadMore();
    };
    $('#keyinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#keygo').click(); });

    // ---- rendering ----
    function counts(r) {
      const match = r.adjusted == null ? '' : (r.count === r.adjusted ? 'ok' : 'bad');
      return `<div class="counts">
        <div><b class="${match}">${r.count ?? '—'}</b><span>machine</span></div>
        <div><b>${r.adjusted ?? '—'}</b><span>human</span></div>
        ${r.target != null ? `<div><b>${r.target}</b><span>target</span></div>` : ''}
      </div>`;
    }

    function rowCard(r) {
      const div = document.createElement('div');
      div.className = 'card'; div.dataset.id = r.id;
      div.innerHTML = `<div class="row">
        <img class="thumb" loading="lazy" src="api/photo/${r.id}" alt="" />
        <div class="meta">
          <div class="when">${fmt(r.ts)} · <code style="font-size:10px">${r.id.slice(0, 8)}</code>
            ${r.low_confidence ? '<span class="flag">⚠ low-confidence</span>' : ''}</div>
          ${counts(r)}
          <div class="tags">${esc(r.variant || '')} ${esc(r.build || '')}</div>
          <div class="edit">
            <input class="num" type="number" placeholder="human #" value="${r.adjusted ?? ''}" data-f="adjusted" />
            <input class="med" placeholder="med" value="${esc(r.med)}" data-f="med" />
            <input class="note" placeholder="note" value="${esc(r.note)}" data-f="note" />
            <button class="save">save</button>
            <button class="del">delete</button>
          </div>
        </div>
      </div>`;
      wireCard(div, r);
      return div;
    }

    function wireCard(div, r) {
      $('.thumb', div).onclick = () => zoom(`api/photo/${r.id}`);
      $('.save', div).onclick = async (e) => {
        const btn = e.target; btn.disabled = true; btn.textContent = '…';
        try {
          const adjRaw = $('[data-f=adjusted]', div).value.trim();
          await admin({
            action: 'label', id: r.id,
            adjusted: adjRaw === '' ? null : +adjRaw,
            med: $('[data-f=med]', div).value.trim() || null,
            note: $('[data-f=note]', div).value.trim() || null,
          });
          btn.textContent = 'saved ✓'; setTimeout(() => { btn.textContent = 'save'; btn.disabled = false; }, 1200);
        } catch (err) { btn.textContent = 'save'; btn.disabled = false; alert('save failed: ' + err.message); }
      };
      $('.del', div).onclick = async () => {
        if (!confirm('Delete this submission (photo + row)?')) return;
        try { await admin({ action: 'delete', id: r.id }); div.remove(); }
        catch (err) { alert('delete failed: ' + err.message); }
      };
    }

    function sessionCard(name, rows) {
      const det = document.createElement('details');
      det.className = 'session';
      const worst = rows.some((r) => r.adjusted != null && r.count !== r.adjusted);
      det.innerHTML = `<summary>session ${esc(name)} — ${rows.length} frames · ${fmt(rows[rows.length - 1].ts)}
        ${worst ? '<span class="bad">has mismatches</span>' : ''}</summary>
        <div class="sess-body">
          <div class="frames"></div>
          <div class="sess-actions"><button class="del">delete session (${rows.length})</button></div>
        </div>`;
      const frames = $('.frames', det);
      for (const r of rows) {
        const f = document.createElement('div');
        f.className = 'frame';
        const match = r.adjusted == null ? '' : (r.count === r.adjusted ? 'ok' : 'bad');
        f.innerHTML = `<img loading="lazy" src="api/photo/${r.id}" alt="" />
          <div><b class="${match}">${r.count ?? '—'}</b>${r.adjusted != null ? ' / ' + r.adjusted : ''}
          ${r.low_confidence ? '<span class="flag">⚠</span>' : ''}</div>
          <div>${fmt(r.ts)}</div>`;
        $('img', f).onclick = () => zoom(`api/photo/${r.id}`);
        frames.appendChild(f);
      }
      $('.sess-actions .del', det).onclick = async (e) => {
        if (!confirm(`Delete all ${rows.length} frames of session ${name}?`)) return;
        const btn = e.target; btn.disabled = true;
        try {
          for (const r of rows) await admin({ action: 'delete', id: r.id });
          det.remove();
        } catch (err) { btn.disabled = false; alert('delete failed: ' + err.message); }
      };
      return det;
    }

    function render(rows) {
      const list = $('#list');
      // group consecutive-agnostic: bucket by session token, keep first-seen order
      const buckets = [];
      const byName = new Map();
      for (const r of rows) {
        const m = r.note && SESSION_RE.exec(r.note);
        if (m) {
          let b = byName.get(m[1]);
          if (!b) { b = { name: m[1], rows: [] }; byName.set(m[1], b); buckets.push(b); }
          b.rows.push(r);
        } else {
          buckets.push({ row: r });
        }
      }
      for (const b of buckets) {
        list.appendChild(b.row ? rowCard(b.row) : sessionCard(b.name, b.rows));
      }
    }

    // ---- pagination ----
    async function loadMore() {
      const btn = $('#more'); btn.disabled = true;
      $('#status').textContent = 'loading…';
      try {
        const body = { action: 'list', limit: 50 };
        if (oldestTs) body.before = oldestTs;
        const { rows } = await admin(body);
        for (const r of rows) rowsById.set(r.id, r);
        if (rows.length) oldestTs = rows[rows.length - 1].ts;
        render(rows);
        $('#status').textContent = `${rowsById.size} submissions loaded`;
        btn.hidden = rows.length < 50;
      } catch (err) {
        if (err.message !== 'unauthorized') $('#status').textContent = 'failed: ' + err.message;
      }
      btn.disabled = false;
    }
    $('#more').onclick = loadMore;

    // ---- lightbox ----
    function zoom(src) { $('#lightbox img').src = src; $('#lightbox').style.display = 'flex'; }
    $('#lightbox').onclick = () => { $('#lightbox').style.display = 'none'; };

    // ---- test suite tile ----
    fetch('testdata/expected.json').then((r) => r.json()).then((exp) => {
      const n = Object.keys(exp).length;
      $('#suite').innerHTML = `
        <div class="tile"><b>${n}</b><span>suite images</span></div>
        <div class="tile"><b><a href="test.html" style="color:#1f8f65;text-decoration:none;font-size:15px">open test bench →</a></b>
          <span>run the suite</span></div>
        <div class="tile"><b>0</b><span>promoted from field</span></div>`;
    }).catch(() => { $('#suite').innerHTML = '<div class="tile"><b>?</b><span>suite unavailable</span></div>'; });

    // ---- boot ----
    if (key) loadMore(); else badKey();
  </script>
</body>
</html>
