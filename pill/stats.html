<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ValEye — Real-World Accuracy</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#faf7f2; --surface:#fff; --surface-2:#f1ece3; --text:#2d3142; --dim:#8a8f9e;
      --pass:#2fb380; --warn:#e9a13b; --fail:#e2606f; --shadow:0 2px 14px rgba(45,49,66,.08); }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--text); padding:24px 20px 60px;
      font-family: ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; max-width:860px; margin:0 auto; }
    h1 { font-size:20px; margin-bottom:2px; }
    .links a { color:#1f8f65; text-decoration:none; margin-right:14px; font-size:14px; }
    .tiles { display:flex; gap:14px; flex-wrap:wrap; margin:20px 0; }
    .tile { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:14px 20px; text-align:center; }
    .tile b { display:block; font-size:26px; }
    .tile span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
    h2 { font-size:16px; margin:24px 0 8px; }
    table { border-collapse:collapse; width:100%; font-size:13px; background:var(--surface);
      border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--surface-2); }
    th { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
    .ok { color:var(--pass); font-weight:700; } .bad { color:var(--fail); font-weight:700; }
    .flag { color:var(--warn); }
    #status { color:var(--dim); font-size:13px; }
  </style>
</head>
<body>
  <h1>ValEye — Real-World Accuracy</h1>
  <div class="links"><a href="./">← app</a> <a href="test.html">test bench</a> <a href="data.html">data manager</a> <a href="about.html">how it works</a></div>
  <p id="status">loading…</p>
  <div class="tiles" id="tiles"></div>
  <h2>Wrong counts (worst first) — each is a future test case</h2>
  <table id="worst"><tr><th>when</th><th>machine</th><th>human</th><th>flagged?</th><th>med</th><th>note</th></tr></table>
  <h2>Recent submissions</h2>
  <table id="recent"><tr><th>when</th><th>machine</th><th>human</th><th>flags</th><th>med</th></tr></table>
  <script>
    const fmt = (ts) => new Date(ts).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    fetch('api/stats').then((r) => r.json()).then(({ totals: t, worst, recent }) => {
      const pct = (n, d) => (d ? Math.round((100 * n) / d) + '%' : '—');
      document.getElementById('tiles').innerHTML = [
        [t.submissions, 'photos'],
        [t.labeled, 'labeled (saved)'],
        [pct(t.exact, t.labeled), 'exact'],
        [pct(t.within10, t.labeled), 'within 10%'],
        [t.meanAbsErr ?? '—', 'mean abs err'],
        [pct(t.wrongFlagged, t.wrongTotal), 'wrong self-flagged'],
      ].map(([v, l]) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('');
      document.getElementById('status').textContent = 'live from real usage · refreshes on reload';
      for (const w of worst) {
        document.getElementById('worst').insertAdjacentHTML('beforeend',
          `<tr><td>${fmt(w.ts)}</td><td class="bad">${w.count}</td><td>${w.adjusted}</td>` +
          `<td>${w.low_confidence ? '<span class="flag">yes ✓</span>' : '<span class="bad">silent ✗</span>'}</td>` +
          `<td>${w.med ?? ''}</td><td>${w.note ?? ''}</td></tr>`);
      }
      for (const r of recent) {
        const ok = r.adjusted == null ? '' : (r.count === r.adjusted ? 'ok' : 'bad');
        document.getElementById('recent').insertAdjacentHTML('beforeend',
          `<tr><td>${fmt(r.ts)}</td><td class="${ok}">${r.count}</td><td>${r.adjusted ?? '—'}</td>` +
          `<td>${r.low_confidence || ''}</td><td>${r.med ?? ''}</td></tr>`);
      }
    }).catch((e) => { document.getElementById('status').textContent = 'failed: ' + e.message; });
  </script>
</body>
</html>
