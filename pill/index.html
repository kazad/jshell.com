<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#faf7f2" />
  <title>ValEye — Pill Counter</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Grant the camera to this origin's own frames so the permission prompt
       isn't re-triggered by embedded contexts. -->
  <meta http-equiv="Permissions-Policy" content="camera=(self)" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <button class="brand" id="brand-btn" title="Tap to force update">
      <img src="icons/icon.svg" alt="" class="brand-icon" />
      <span>ValEye</span>
      <span id="build-tag" class="build-tag"></span>
    </button>
    <div id="engine-status" class="engine-status">Loading…</div>
    <a href="about.html" class="icon-btn" aria-label="How it works" style="text-decoration:none;display:grid;place-items:center;font-size:15px;font-weight:700">?</a>
    <button id="history-btn" class="icon-btn" aria-label="History">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
    </button>
  </header>

  <!-- Camera screen -->
  <main id="camera-screen" class="screen">
    <div class="viewport">
      <video id="viewfinder" playsinline muted autoplay></video>
      <canvas id="preview-canvas" class="preview-canvas" hidden></canvas>
      <canvas id="live-overlay" class="live-overlay" hidden></canvas>
      <div id="live-count" class="live-count" hidden>~ 0</div>
      <div id="camera-fallback" class="camera-fallback" hidden>
        <p>Camera unavailable.</p>
        <p class="sub">Tap here to choose a photo of pills on a plain, contrasting tray.</p>
      </div>
      <!-- Square capture area: sides dimmed so the tray is centered with a
           margin, and no pill is sliced by the frame edge. -->
      <div class="capture-guide" id="capture-guide">
        <div class="guide-dim guide-top"></div>
        <div class="guide-dim guide-bottom"></div>
        <div class="guide-dim guide-left"></div>
        <div class="guide-dim guide-right"></div>
        <div class="guide-square"></div>
      </div>
    </div>

    <div class="helper helper-below">
      <img src="icons/doodle.svg" alt="Goldendoodle helper" class="helper-dog" />
      <div id="helper-tip" class="helper-bubble">Spread the pills out flat — no piles! — and I’ll count them. 🐾</div>
    </div>

    <!-- Anchored bottom dock: primary action + controls own the bottom. -->
    <div class="camera-dock">
      <button id="use-count" class="pill-btn primary use-count" hidden>Use this count ✓</button>
      <div class="controls">
      <!-- Left: live control. Center: shutter. Right: target. Symmetric,
           thumb-reachable, one primary action. -->
      <div class="control-slot">
        <button id="live-toggle" class="round-btn" aria-label="Pause live counting" disabled>
          <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="7" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1.4" fill="currentColor"/>
          </svg>
          <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3c-.7-.4-1.6.1-1.6.9z" fill="currentColor"/>
          </svg>
        </button>
        <span class="control-label" id="live-label">Live</span>
      </div>

      <div class="control-slot">
        <button id="shutter" class="shutter" aria-label="Snap and count" disabled>
          <span class="shutter-ring"></span>
        </button>
        <span class="control-label">Snap</span>
      </div>

      <div class="control-slot">
        <input id="target-input" class="target-input" type="number" inputmode="numeric" min="1" placeholder="—" aria-label="Target count" />
        <span class="control-label">Target</span>
      </div>
    </div>

    <div class="control-extras">
      <button id="upload-btn" class="pill-btn subtle">Take photo</button>
      <select id="live-fps" class="fps-select" title="Live counting rate" aria-label="Live counting rate">
        <option value="0.5">0.5 fps</option>
        <option value="1">1 fps</option>
        <option value="2" selected>2 fps</option>
        <option value="4">4 fps</option>
      </select>
      <button id="session-btn" class="pill-btn subtle" hidden>Report count</button>
      <!-- Camera path: accept a CONCRETE type (not image/*) so iOS honours
           `capture` and opens the camera directly instead of showing the
           Photo Library / Take Photo / Choose File sheet. -->
      <input id="file-input" type="file" accept="image/jpeg,image/png" capture="environment" hidden />
      <input id="library-input" type="file" accept="image/*" hidden />
    </div>
    </div>
  </main>

  <!-- Result screen -->
  <main id="result-screen" class="screen" hidden>
    <div class="result-photo" id="result-photo">
      <div class="zoom-wrap" id="zoom-wrap">
        <canvas id="photo-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
        <!-- Crop editor: drag inside to move, drag a corner to resize. The
             count recounts live as the area changes. -->
        <div class="crop-box" id="crop-box" hidden>
          <div class="crop-handle tl" data-h="tl"></div>
          <div class="crop-handle tr" data-h="tr"></div>
          <div class="crop-handle bl" data-h="bl"></div>
          <div class="crop-handle br" data-h="br"></div>
        </div>
      </div>
    </div>

    <div class="result-panel">
      <div class="count-row">
        <button id="adjust-minus" class="icon-btn big" aria-label="Decrease count">−</button>
        <div class="count-display">
          <div id="count-value" class="count-value">0</div>
          <div class="count-label">pills</div>
        </div>
        <button id="adjust-plus" class="icon-btn big" aria-label="Increase count">+</button>
      </div>
      <div id="target-info" class="target-info"></div>
      <div class="helper helper-inline">
        <img src="icons/doodle.svg" alt="" class="helper-dog small" />
        <div id="helper-react" class="helper-bubble">Counting done!</div>
      </div>
      <input id="med-name" type="text" placeholder="Medication name (optional)" autocomplete="off" />
      <div class="result-actions">
        <button id="retake-btn" class="pill-btn">Retake</button>
        <button id="adjust-btn" class="pill-btn">Adjust area</button>
        <button id="save-btn" class="pill-btn primary">Save count</button>
      </div>
      <button id="report-btn" class="pill-btn subtle report-btn">⚠︎ Count is wrong — report it</button>
    </div>

    <!-- Report sheet: slides up from the bottom, stepper for the true count,
         optional note, explicit submit. No browser alerts. -->
    <div class="sheet-scrim" id="report-sheet" hidden>
      <div class="sheet" role="dialog" aria-label="Report a wrong count">
        <div class="sheet-grab"></div>
        <h3 class="sheet-title">What’s the real count?</h3>
        <p class="sheet-sub" id="sheet-machine">ValEye counted 0</p>
        <div class="stepper">
          <button class="icon-btn big" id="sheet-minus" aria-label="Decrease">−</button>
          <div class="stepper-value" id="sheet-value">0</div>
          <button class="icon-btn big" id="sheet-plus" aria-label="Increase">+</button>
        </div>
        <textarea id="sheet-note" class="sheet-note" rows="2"
          placeholder="What went wrong? (optional — e.g. “missed the sideways pill”)"></textarea>
        <div class="sheet-actions">
          <button class="pill-btn" id="sheet-cancel">Cancel</button>
          <button class="pill-btn primary" id="sheet-submit">Send report</button>
        </div>
      </div>
    </div>
  </main>

  <!-- History screen -->
  <main id="history-screen" class="screen" hidden>
    <div class="history-header">
      <button id="history-back" class="icon-btn" aria-label="Back">←</button>
      <h2>History</h2>
      <button id="history-clear" class="pill-btn danger" hidden>Clear</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
