<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ValEye — Needs Your Eyes</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg:#faf7f2; --surface:#fff; --surface-2:#f1ece3;
      --text:#2d3142; --dim:#8a8f9e; --pass:#2fb380; --warn:#e9a13b;
      --shadow:0 2px 14px rgba(45,49,66,.08);
    }
    *{box-sizing:border-box;margin:0}
    body{background:var(--bg);color:var(--text);padding:20px 16px 70px;max-width:860px;margin:0 auto;
      font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
    h1{font-size:20px;margin-bottom:4px}
    h1 a{color:var(--dim);text-decoration:none;font-weight:400;font-size:15px}
    .sub{color:var(--dim);font-size:13px;margin-bottom:20px;line-height:1.5}
    .item{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);
      padding:18px;margin-bottom:22px}
    .item.answered{opacity:.55}
    .item h2{font-size:16px;margin-bottom:8px}
    .ctx{font-size:13.5px;line-height:1.6;color:#4a4f60;margin-bottom:14px}
    .imgs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
    .imgs figure{margin:0}
    .imgs img{width:100%;border-radius:10px;display:block;background:#000}
    .imgs figcaption{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45}
    .q{font-weight:700;font-size:14.5px;margin-bottom:10px}
    .opts{display:flex;flex-direction:column;gap:8px}
    .opts button{
      text-align:left;background:var(--surface-2);border:2px solid transparent;border-radius:12px;
      padding:12px 14px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
    }
    .opts button:hover{border-color:var(--pass)}
    .opts button.picked{background:var(--pass);color:#fff}
    .done{font-size:13px;color:var(--pass);font-weight:700;margin-top:10px}
    textarea{width:100%;margin-top:10px;border:1.5px solid var(--surface-2);border-radius:10px;
      padding:10px;font-family:inherit;font-size:13.5px;resize:vertical}
  </style>
</head>
<body>
  <h1>Needs Your Eyes <a href="./">← app</a> <a href="test.html">bench</a> <a href="report.html">report</a></h1>
  <p class="sub">
    Open questions only a human can settle — disputed pills, standing verdicts,
    go/no-go calls. Tap an answer (add a note if you like); it lands in the
    feedback channel and I pick it up from there.
  </p>
  <div id="list"></div>

  <script type="module">
    const list = document.getElementById('list');
    const answered = JSON.parse(localStorage.getItem('ve_reviews') || '{}');
    let data;
    try {
      data = await (await fetch('docs/review/items.json', { cache: 'no-store' })).json();
    } catch {
      list.innerHTML = '<p class="sub">Could not load review items.</p>';
    }
    for (const item of data?.items || []) {
      const el = document.createElement('div');
      el.className = 'item' + (answered[item.id] ? ' answered' : '');
      el.innerHTML = `
        <h2>${item.title}</h2>
        <div class="ctx">${item.context}</div>
        <div class="imgs">${item.images.map((im) =>
          `<figure><img src="docs/review/${im.src}" loading="lazy" alt="" />
           <figcaption>${im.caption}</figcaption></figure>`).join('')}</div>
        <div class="q">${item.question}</div>
        <div class="opts">${item.options.map((o, i) =>
          `<button data-i="${i}">${o}</button>`).join('')}</div>
        <textarea rows="2" placeholder="Optional note…"></textarea>
        <div class="done" hidden>Recorded — thank you. 🐾</div>`;
      const note = el.querySelector('textarea');
      el.querySelectorAll('.opts button').forEach((b) => {
        if (answered[item.id] === b.textContent) b.classList.add('picked');
        b.addEventListener('click', async () => {
          el.querySelectorAll('.opts button').forEach((x) => x.classList.remove('picked'));
          b.classList.add('picked');
          const fd = new FormData();
          fd.append('meta', JSON.stringify({
            note: `REVIEW: ${item.id} = ${b.textContent}` +
                  (note.value.trim() ? ` — ${note.value.trim()}` : ''),
            variant: 'review',
          }));
          try { await fetch('api/submit', { method: 'POST', body: fd }); } catch {}
          answered[item.id] = b.textContent;
          localStorage.setItem('ve_reviews', JSON.stringify(answered));
          el.querySelector('.done').hidden = false;
        });
      });
      list.appendChild(el);
    }
  </script>
</body>
</html>
