<!doctype html>
<meta charset="utf-8">
<title>ValEye · tile triage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --dim:#8a8f9e; --ok:#3ddc97; --warn:#e9a13b; --bad:#e2606f; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:#e6edf3; font:14px/1.45 system-ui,sans-serif }
  header { padding:12px 16px; background:var(--panel); position:sticky; top:0; z-index:5;
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #21262d }
  h1 { font-size:15px; margin:0; font-weight:650 }
  .dim { color:var(--dim) }
  button { background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:6px;
           padding:7px 12px; cursor:pointer; font-size:13px }
  button:hover { background:#2b3138 }
  button.pri { background:#1f6feb; border-color:#1f6feb }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; padding:16px }
  .tile { background:var(--panel); border:1px solid #21262d; border-radius:10px; overflow:hidden }
  .tile canvas { width:100%; display:block; cursor:crosshair; background:#000 }
  .meta { padding:8px 10px; display:flex; justify-content:space-between; align-items:center; gap:8px }
  .count { font-weight:700; font-size:17px }
  .count.set { color:var(--ok) }
  .why { font-size:11.5px; color:var(--dim); padding:0 10px 9px; line-height:1.35 }
  .done { outline:2px solid var(--ok) }
  #status { margin-left:auto; font-size:13px }
</style>

<header>
  <h1>Tile triage</h1>
  <span class="dim">Click each pill once. Right-click / click a dot to remove. Only the spots the counter is unsure about.</span>
  <button id="save" class="pri">save all</button>
  <span id="status" class="dim"></span>
</header>
<div id="grid"></div>

<script>
// Small crops instead of whole images: the owner's time is the scarce resource,
// so ask only about the places the algorithm is actually uncertain. Each tile
// carries its own source rect, so a click maps straight back to native pixels.
const $ = (s) => document.querySelector(s);
let TILES = [];
const marks = new Map();   // tile index -> [[x,y],...] in NATIVE image px

async function load() {
  const r = await fetch('tiles.json', { cache: 'no-store' }).then((x) => x.json());
  TILES = r.tiles || [];
  $('#status').textContent = `${TILES.length} tiles need a human`;
  const grid = $('#grid');
  TILES.forEach((t, i) => {
    marks.set(i, []);
    const el = document.createElement('div');
    el.className = 'tile';
    el.innerHTML = `<canvas id="c${i}"></canvas>
      <div class="meta"><span class="dim">${t.file.split('/').pop()}</span>
      <span class="count" id="n${i}">0</span></div>
      <div class="why">${t.why}</div>`;
    grid.appendChild(el);
    const cv = el.querySelector('canvas');
    const img = new Image();
    img.onload = () => {
      cv.width = t.w; cv.height = t.h;
      cv.__img = img; draw(i);
    };
    img.src = t.png;
    cv.addEventListener('click', (e) => hit(e, i, cv, false));
    cv.addEventListener('contextmenu', (e) => { e.preventDefault(); hit(e, i, cv, true); });
  });
}

function hit(e, i, cv, remove) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (cv.width / r.width);
  const y = (e.clientY - r.top) * (cv.height / r.height);
  const t = TILES[i], list = marks.get(i);
  // nearest existing mark, in tile px
  let bi = -1, bd = 14;
  list.forEach((m, k) => {
    const mx = (m[0] - t.x0) * t.scale, my = (m[1] - t.y0) * t.scale;
    const d = Math.hypot(mx - x, my - y);
    if (d < bd) { bd = d; bi = k; }
  });
  if (remove || bi >= 0) { if (bi >= 0) list.splice(bi, 1); }
  else list.push([+(t.x0 + x / t.scale).toFixed(1), +(t.y0 + y / t.scale).toFixed(1)]);
  draw(i);
}

function draw(i) {
  const t = TILES[i], cv = document.getElementById('c' + i);
  if (!cv || !cv.__img) return;
  const g = cv.getContext('2d');
  g.drawImage(cv.__img, 0, 0, cv.width, cv.height);
  const list = marks.get(i);
  list.forEach((m, k) => {
    const x = (m[0] - t.x0) * t.scale, y = (m[1] - t.y0) * t.scale;
    g.beginPath(); g.arc(x, y, 9, 0, 6.284);
    g.strokeStyle = '#3ddc97'; g.lineWidth = 2.5; g.stroke();
    g.fillStyle = '#3ddc97'; g.font = 'bold 12px system-ui';
    g.fillText(k + 1, x + 11, y - 7);
  });
  const n = document.getElementById('n' + i);
  n.textContent = list.length;
  n.className = 'count' + (list.length ? ' set' : '');
  cv.parentElement.classList.toggle('done', list.length > 0);
}

$('#save').onclick = async () => {
  const payload = TILES.map((t, i) => ({
    file: t.file, rect: [t.x0, t.y0, t.x1, t.y1],
    centers: marks.get(i), n: marks.get(i).length, why: t.why,
  })).filter((p) => p.n > 0);
  if (!payload.length) { $('#status').textContent = 'nothing marked yet'; return; }
  $('#status').textContent = 'saving…';
  try {
    const r = await (await fetch('api/tiles', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ tiles: payload }) })).json();
    $('#status').innerHTML = r.ok
      ? `<span style="color:var(--ok)">saved ${payload.length} tiles — thank you</span>`
      : `<span style="color:var(--bad)">${r.error}</span>`;
  } catch (e) { $('#status').innerHTML = `<span style="color:var(--bad)">${e.message}</span>`; }
};
load();
</script>
