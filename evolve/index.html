<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaCalc /evolve — UI Layout Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- JShell / InstaCalc theme tokens (mirrors assets/tool.css) ---------- */
  :root {
    --color-bg: #0d0d0d;
    --color-header: #141414;
    --color-surface: #0d0d0d;
    --color-surface-hover: #1a1a1a;
    --color-border: #222222;
    --color-text-main: #e0e0e0;
    --color-text-muted: #777777;
    --color-accent: #ffffff;
    --color-accent-blue: #3b82f6;
    --color-success: #00ff88;
    --editor-bg: #000000;
    --tint-blue: rgba(59, 130, 246, .14);
    --tint-success: rgba(0, 255, 136, .10);
    --shadow: 0 10px 34px rgba(0, 0, 0, .45);
  }
  body.light-theme {
    --color-bg: #ffffff;
    --color-header: #f9f9f9;
    --color-surface: #ffffff;
    --color-surface-hover: #f5f5f5;
    --color-border: #eaeaea;
    --color-text-main: #171717;
    --color-text-muted: #666666;
    --color-accent: #000000;
    --color-accent-blue: #2563eb;
    --color-success: #10b981;
    --editor-bg: #ffffff;
    --tint-blue: rgba(37, 99, 235, .08);
    --tint-success: rgba(16, 185, 129, .10);
    --shadow: 0 10px 34px rgba(0, 0, 0, .12);
  }

  /* ---------- reset / base ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg); color: var(--color-text-main);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  a { cursor: pointer; }
  img { max-width: 100%; }

  #stage { height: 100vh; overflow: hidden; }
  .L { height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--color-bg); color: var(--color-text-main); }

  /* ---------- shared InstaCalc components (today's look) ---------- */
  .ic-brand { font-weight: 800; letter-spacing: -0.02em; color: var(--color-text-main); white-space: nowrap; }
  .ic-brand b, .ic-brand span { color: var(--color-accent-blue); font-weight: 800; }

  .ic-topbar {
    background: var(--color-header);
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; gap: 16px;
    padding: 8px 16px; min-height: 45px;
    position: sticky; top: 0; z-index: 10;
  }

  .ic-btn {
    background: var(--color-surface-hover);
    border: 1px solid var(--color-border);
    color: var(--color-text-main);
    padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; cursor: pointer; transition: all .1s;
  }
  .ic-btn:hover { border-color: var(--color-text-muted); background: var(--color-border); }
  .ic-btn.primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
  .ic-btn.primary:hover { opacity: .9; }
  .ic-btn.blue { background: var(--color-accent-blue); color: #fff; border-color: var(--color-accent-blue); }

  .ic-search {
    background: var(--editor-bg); border: 1px solid var(--color-border);
    border-radius: 6px; padding: 7px 12px; color: var(--color-text-muted);
    font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .ic-search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--color-text-main); font: inherit; }

  .ic-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; }

  .ic-tag {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px; text-transform: uppercase;
    color: var(--color-text-muted); background: var(--color-surface-hover);
    padding: 2px 6px; border-radius: 4px; letter-spacing: .04em;
  }

  /* live-calc component — styled like today's /calc notebook, with syntax highlight */
  .ic-calc {
    display: flex;
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-ligatures: none;
    font-size: 14px;
    background: var(--editor-bg);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 10px 14px;
    transition: border-color .15s;
  }
  .ic-calc:focus-within { border-color: var(--color-accent-blue); }
  .ic-calc.bare { background: transparent; border: 0; border-radius: 0; padding: 0; }
  .ic-edit { position: relative; flex: 1; min-width: 0; display: flex; }
  .ic-hl {
    position: absolute; inset: 0; margin: 0;
    pointer-events: none; overflow: hidden;
    font: inherit; line-height: 28px; white-space: pre;
    color: var(--color-text-main);
  }
  .ic-calc textarea {
    flex: 1; min-width: 0; position: relative; z-index: 1;
    border: 0; outline: 0; resize: none;
    background: transparent;
    color: transparent; caret-color: var(--color-text-main);
    font: inherit; line-height: 28px;
    white-space: pre; overflow: auto;
  }
  .ic-calc textarea::selection { background: var(--tint-blue); }
  .tk-c { color: var(--color-text-muted); font-style: italic; }
  .tk-n { color: var(--color-accent-blue); }
  .tk-o { color: var(--color-text-muted); }
  .ic-out {
    min-width: 96px; text-align: right;
    line-height: 28px; white-space: pre;
    overflow: hidden; user-select: none;
    color: var(--color-success);
  }
  .ic-out div { opacity: .55; font-weight: 500; }
  .ic-out .em { opacity: 1; font-weight: 700; }
  .ic-out .err { color: var(--color-text-muted); font-weight: 400; opacity: .5; }

  /* themed scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

  /* mini static preview used in gallery cards */
  .ic-thumb {
    overflow: hidden;
    background: var(--color-header);
    border: 1px solid var(--color-border);
  }
  body.light-theme .ic-thumb { background: var(--color-surface-hover); }
  .ic-mini { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.7; font-variant-ligatures: none; }
  .ic-mini .ml { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
  .ic-mini .ml span { color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic-mini .ml b { color: var(--color-success); font-weight: 600; white-space: nowrap; }

  /* ---------- switcher bar ---------- */
  #switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 9000; display: flex; align-items: center; gap: 4px;
    background: rgba(17,19,24,.92); backdrop-filter: blur(12px);
    color: #e7e9ee; border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 6px 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    font-size: 13px; user-select: none;
  }
  #switcher button {
    background: none; border: 0; color: #e7e9ee;
    padding: 6px 9px; border-radius: 999px; font-size: 13px; line-height: 1;
  }
  #switcher button:hover { background: rgba(255,255,255,.12); }
  #switcher .sw-name { padding: 0 6px; white-space: nowrap; }
  #switcher .sw-name b { font-weight: 650; }
  #switcher .sw-name i { font-style: normal; color: #9aa3b2; margin-left: 7px; }
  #switcher .sw-count { color: #9aa3b2; font-variant-numeric: tabular-nums; padding: 0 4px; }
  #switcher .sw-grid { border-left: 1px solid rgba(255,255,255,.15); margin-left: 4px; padding-left: 12px; }
  body.no-chrome #switcher { display: none; }

  /* ---------- overview overlay ---------- */
  #overview {
    position: fixed; inset: 0; z-index: 9500; overflow-y: auto;
    background: rgba(10,12,16,.96); backdrop-filter: blur(8px);
    color: #e7e9ee; display: none; padding: 48px 40px 80px;
  }
  #overview.open { display: block; }
  #overview .ov-head { max-width: 1180px; margin: 0 auto 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  #overview h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  #overview h1 span { color: #5b8def; }
  #overview .ov-sub { color: #9aa3b2; font-size: 14px; }
  #overview .ov-close { margin-left: auto; background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 8px; padding: 8px 14px; }
  #overview .ov-grid {
    max-width: 1180px; margin: 22px auto 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;
  }
  .ov-card {
    background: #171a21; border: 1px solid #262b36; border-radius: 12px;
    padding: 14px; cursor: pointer; transition: border-color .12s, transform .12s;
  }
  .ov-card:hover { border-color: #5b8def; transform: translateY(-2px); }
  .ov-card.active { border-color: #5b8def; box-shadow: 0 0 0 1px #5b8def; }
  .ov-card .ov-rec { display: inline-block; background: rgba(0,255,136,.14); color: #4ade80; border-radius: 999px; padding: 1px 9px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin-top: 10px; }
  .ov-card .ov-n { font-weight: 650; font-size: 14px; margin-top: 10px; }
  .ov-card .ov-rec + .ov-n { margin-top: 6px; }
  .ov-card .ov-n small { color: #8b93a5; font-weight: 400; margin-left: 6px; }
  .ov-card .ov-d { color: #9aa3b2; font-size: 12px; line-height: 1.45; margin-top: 4px; }
  .ov-card .ov-k { color: #6b7385; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-top: 8px; }

  /* wireframe schematics */
  .wire { height: 84px; border-radius: 7px; background: #0e1116; border: 1px solid #262b36; padding: 6px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .wire .w-bar { height: 9px; border-radius: 2px; background: #3a4252; flex: none; }
  .wire .w-row { display: flex; gap: 4px; flex: 1; min-height: 0; }
  .wire .w-rail { width: 22%; border-radius: 2px; background: #2a3140; }
  .wire .w-main { flex: 1; border-radius: 2px; background: #1c212b; position: relative; }
  .wire .w-main.grid { background: repeating-linear-gradient(90deg,#1c212b 0 22%,#0e1116 22% 25%); }
  .wire .w-main.feed { background: repeating-linear-gradient(180deg,#1c212b 0 26%,#0e1116 26% 34%); }
  .wire .w-center { width: 46%; margin: auto; height: 60%; border-radius: 3px; background: #1c212b; border: 1px solid #333c4d; }
  .wire .w-full { flex: 1; border-radius: 3px; background: linear-gradient(160deg,#1c212b,#12151c); border: 1px solid #333c4d; }
</style>
</head>
<body>
  <div id="stage"></div>
  <style id="layout-css"></style>

  <div id="switcher">
    <button id="sw-prev" title="Previous layout (←)">‹</button>
    <span class="sw-name"><b id="sw-title">—</b><i id="sw-app">—</i></span>
    <span class="sw-count" id="sw-count">1/20</span>
    <button id="sw-next" title="Next layout (→)">›</button>
    <button id="sw-theme" title="Toggle light/dark theme (T)">◐</button>
    <button class="sw-grid" id="sw-open" title="All layouts (G)">⊞ All layouts</button>
  </div>

  <div id="overview">
    <div class="ov-head">
      <h1>InstaCalc <span>/evolve</span></h1>
      <div class="ov-sub">21 homepage + calc-navigation concepts, each borrowing the bones of a familiar app. Same product — live calcs, gallery, search — different skeleton. Use ← → to flip, G for this grid. <a href="evolver.html" style="color:#4ade80;text-decoration:none">🧬 Evolve today's UI (toggleable) →</a> <a href="flows.html" style="color:#5b8def;text-decoration:none">Workspace user flows →</a> <a href="system.html" style="color:#5b8def;text-decoration:none">Nav system & view modes →</a></div>
      <button class="ov-close" id="ov-close">Close ✕</button>
    </div>
    <div class="ov-grid" id="ov-grid"></div>
  </div>

  <script src="shared.js"></script>
  <script src="layouts0.js"></script>
  <script src="layouts1.js"></script>
  <script src="layouts2.js"></script>
  <script src="app.js"></script>
</body>
</html>
